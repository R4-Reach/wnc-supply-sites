spring.application.name=supplies-database

server.port=${SERVER_PORT:8080}
jdbi.url=jdbc:postgresql://${DB_URL:localhost:5432}/${DB_NAME:wnc_helene}
jdbi.user=${DB_USER:wnc_helene}
jdbi.password=${DB_PASS:wnc_helene}
spring.mustache.suffix:.html
spring.mustache.prefix=classpath:/public/

distance.calculator.enabled=${ENABLE_DISTANCE_CALCULATOR:false}
distance.calculator.delay.ms: 10

# Twilio SMS on/off is a deploy-time toggle. The credentials (account SID, auth token) and the
# from-number, along with the Google Maps API key, now live in the site_config table and are edited
# via the Site Config admin page.
twilio.sms.enabled=${TWILIO_SMS_ENABLED:false}

# Master key for encrypting secret site_config values (AES-GCM). Base64-encoded 16/24/32 bytes.
# The default below is a throwaway all-zero key for local dev and tests ONLY; production must set
# DB_ENCRYPTION_KEY to a real random key.
db.encryption.key=${DB_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
