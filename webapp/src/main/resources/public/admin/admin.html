<html xmlns="http://www.w3.org/1999/html" lang="en">
<head>
  <title>WNC Supply Sites - Admin</title>
  <link rel="stylesheet" href="../style.css"/>
  <link rel="stylesheet" href="../mobile.css"/>
  {{> header-include }}
</head>
<body>
{{> header }}

<div class="page-sub-header horizontal">
  <div class="back-link">
    <a href="/">[&larr; Go Back]</a>
  </div>
  <span class="page-title-sub-header">Admin</span>
</div>

<div class="nav-buttons-container">
  {{#isUserAdmin}}
  <div class="nav-button-container">
    <a href="/admin/users">
      <button type="button" class="nav-button wide-button">
        Users
      </button>
    </a>
  </div>
  {{/isUserAdmin}}

  {{#showInventory}}
  <div class="nav-button-container">
    <a href="/admin/inventory">
      <button type="button" class="nav-button wide-button">
        Inventory
      </button>
    </a>
  </div>
  {{/showInventory}}

  {{#isSiteAdmin}}
  <div class="nav-button-container">
    <a href="/admin/site-config">
      <button type="button" class="nav-button wide-button">
        Site Config
      </button>
    </a>
  </div>
  {{/isSiteAdmin}}
</div>

</body>
</html>
