<html xmlns="http://www.w3.org/1999/html" lang="en">
<head>
  <title>WNC Supply Sites - Item Merge</title>
  <link rel="stylesheet" href="../style.css"/>
  <link rel="stylesheet" href="../mobile.css"/>
  <link rel="stylesheet" href="merge-items.css"/>
  <style>
    /* Enable the Merge button only once a keep item and at least one merge item are chosen. */
    .merge-button { opacity: .5; pointer-events: none; }
    #merge-form:has(input[name=mergeInto]:checked):has(input[name=mergeItems]:checked) .merge-button {
      opacity: 1;
      pointer-events: auto;
    }

    /* Highlight the row kept and the rows being merged away. */
    #itemTable tbody tr:has(input[name=mergeItems]:checked) { background: #f6d9d9; }
    #itemTable tbody tr:has(input[name=mergeInto]:checked) { background: #d9f6d9; }
    /* The keep row's own "merge" checkbox is a no-op (never merged into itself). */
    #itemTable tbody tr:has(input[name=mergeInto]:checked) input[name=mergeItems] { opacity: .3; }
  </style>
  {{> header-include }}
</head>
<body>
{{> header }}
<div class="page-sub-header horizontal">
  <div class="back-link">
    <a href="/admin/inventory">[&larr; Go Back]</a>
  </div>
  <span class="page-title-sub-header">Merge Items</span>
</div>

<form id="merge-form"
      hx-post="/admin/merge-items/do-merge"
      hx-target="#itemTableWrap"
      hx-swap="outerHTML"
      hx-confirm="Are you sure? The checked items will be merged into the selected keep item and then deleted.">
  <div class="centered">
    <button type="submit" class="merge-button" id="mergeButton">Merge!</button>
  </div>

  {{> admin/merge-items-table }}
</form>

</body>
</html>
