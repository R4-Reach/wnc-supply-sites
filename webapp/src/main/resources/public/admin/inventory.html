<html xmlns="http://www.w3.org/1999/html" lang="en">
<head>
  <title>WNC Supply Sites - Admin Inventory</title>
  <link rel="stylesheet" href="../style.css"/>
  <link rel="stylesheet" href="../mobile.css"/>
  {{> header-include }}
</head>
<body>
{{> header }}

<div class="page-sub-header horizontal">
  <div class="back-link">
    <a href="/admin">[&larr; Go Back]</a>
  </div>
  <span class="page-title-sub-header">Admin Inventory</span>
</div>

<div class="nav-buttons-container">
  {{#isUserAdmin}}
  <div class="nav-button-container">
    <a href="/admin/merge-items">
      <button type="button" class="nav-button wide-button">
        Merge Items
      </button>
    </a>
  </div>
  {{/isUserAdmin}}

  {{#isDataAdmin}}
  <div class="nav-button-container">
    <a href="/admin/tag-items">
      <button type="button" class="nav-button wide-button">
        Tag Items
      </button>
    </a>
  </div>
  {{/isDataAdmin}}
</div>

</body>
</html>
