<html xmlns="http://www.w3.org/1999/html" lang="en">
<head>
  <title>WNC Supply Sites - Site Management</title>
  <link rel="stylesheet" href="../../style.css"/>
  <link rel="stylesheet" href="../../mobile.css"/>
  <link rel="stylesheet" href="../manage.css"/>
  <link rel="stylesheet" href="address.css"/>
  {{> header-include }}
</head>

<body>
{{> header }}

<div class="page-sub-header horizontal">
  <div class="back-link">
    <a href="/manage/site-selected?siteId={{siteId}}">[&larr; Go Back]</a>
  </div>
  <span class="page-title-sub-header">{{siteName}} - Site Address</span>
</div>

<h3>Site Info - publicly visible</h3>

<div id="data-entry">
  <div class="data-entry-div vertical">

    <div class="data-field vertical">
      <label for="Site Name">Site Name:<span class="required">*</span></label>
      <form class="horizontal" hx-post="/manage/update-site"
            hx-target="next .confirm-text" hx-swap="innerHTML">
        <input type="hidden" name="siteId" value="{{siteId}}">
        <input type="hidden" name="field" value="Site Name">
        <input id="Site Name" name="newValue" type="text" class="shortTextField" value="{{siteName}}"
               maxlength="128" required/>
        <button type="submit" class="update-button">Update</button>
      </form>
      <div class="confirm-text"></div>
    </div>

    <div class="data-field vertical">
      <label for="Street Address">Street Address:<span class="required">*</span></label>
      <form class="horizontal" hx-post="/manage/update-site"
            hx-target="next .confirm-text" hx-swap="innerHTML">
        <input type="hidden" name="siteId" value="{{siteId}}">
        <input type="hidden" name="field" value="Street Address">
        <input id="Street Address" name="newValue" type="text" class="shortTextField" value="{{address}}"
               maxlength="64" required/>
        <button type="submit" class="update-button">Update</button>
      </form>
      <div class="confirm-text"></div>
    </div>

    <div class="data-field vertical">
      <label for="City">City:<span class="required">*</span></label>
      <form class="horizontal" hx-post="/manage/update-site"
            hx-target="next .confirm-text" hx-swap="innerHTML">
        <input type="hidden" name="siteId" value="{{siteId}}">
        <input type="hidden" name="field" value="City">
        <input id="City" name="newValue" type="text" class="shortTextField" value="{{city}}"
               maxlength="32" required/>
        <button type="submit" class="update-button">Update</button>
      </form>
      <div class="confirm-text"></div>
    </div>

    <div class="data-field vertical">
      <label for="State">State/Country:<span class="required">*</span></label>
      <form class="horizontal" hx-post="/manage/update-site"
            hx-vals='js:{siteId: "{{siteId}}", field: "State", newValue: document.getElementById("County").value + "," + document.getElementById("State").value}'
            hx-target="next .confirm-text" hx-swap="innerHTML">
        <select id="State" onchange="changeCounty()">
          {{#stateList}}
          <option value="{{name}}" {{selected}}>{{name}}</option>
          {{/stateList}}
        </select>
        <button type="submit" class="update-button">Update</button>
      </form>
      <div class="confirm-text"></div>
    </div>

    <div class="data-field vertical">
      <label for="County">County:<span class="required">*</span></label>
      <form class="horizontal" hx-post="/manage/update-site"
            hx-vals='js:{siteId: "{{siteId}}", field: "County", newValue: document.getElementById("County").value + "," + document.getElementById("State").value}'
            hx-target="next .confirm-text" hx-swap="innerHTML">
        <select id="County">
          {{#countyList}}
          <option value="{{name}}" {{selected}}>{{name}}</option>
          {{/countyList}}
        </select>
        <button type="submit" class="update-button">Update</button>
      </form>
      <div class="confirm-text"></div>
    </div>

    <div class="data-field vertical">
      <label for="Website">Website: </label>
      <form class="horizontal" hx-post="/manage/update-site"
            hx-target="next .confirm-text" hx-swap="innerHTML">
        <input type="hidden" name="siteId" value="{{siteId}}">
        <input type="hidden" name="field" value="Website">
        <input id="Website" name="newValue" type="text" class="shortTextField" value="{{website}}"
               maxlength="128" placeholder="your-website.com"/>
        <button type="submit" class="update-button">Update</button>
      </form>
      <div class="confirm-text"></div>
    </div>

    <div class="data-field vertical">
      <label for="Facebook">Facebook: </label>
      <form class="horizontal" hx-post="/manage/update-site"
            hx-target="next .confirm-text" hx-swap="innerHTML">
        <input type="hidden" name="siteId" value="{{siteId}}">
        <input type="hidden" name="field" value="Facebook">
        <input id="Facebook" name="newValue" type="text" class="shortTextField" value="{{facebook}}"
               maxlength="128" placeholder="facebook.com/your-group"/>
        <button type="submit" class="update-button">Update</button>
      </form>
      <div class="confirm-text"></div>
    </div>

    <div class="data-field vertical">
      <label for="Weekly Served">(Est.) Number of People Served Weekly:</label>
      <form class="horizontal" hx-post="/manage/update-site"
            hx-target="next .confirm-text" hx-swap="innerHTML">
        <input type="hidden" name="siteId" value="{{siteId}}">
        <input type="hidden" name="field" value="Weekly Served">
        <input id="Weekly Served" name="newValue" type="number" class="shortTextField"
               value="{{weeklyServed}}" required/>
        <button type="submit" class="update-button">Update</button>
      </form>
      <div class="confirm-text"></div>
    </div>

  </div>
</div>


<script>
  const countyMapByState = new Map();
  {{#fullCountyList}}
    // loop over each state
    {{#entrySet}}
      countyMapByState['{{key}}'] = countyMapByState['{{key}}'] || [];
      // add counties
      {{#value}}
      countyMapByState['{{key}}'].push('{{.}}');
      {{/value}}
    {{/entrySet}}
  {{/fullCountyList}}

  // Repopulates the county dropdown when the state changes; county data is preloaded above so this
  // stays instant and offline-friendly.
  function changeCounty() {
    const state = document.getElementById('State').value;
    const counties = (countyMapByState[state] || []).slice().sort();
    document.getElementById('County').innerHTML =
        counties.map(c => `<option value="${c}">${c}</option>`).join('');
  }
</script>
</body>
</html>
