<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="./delivery-form.css">
  <title>Volunteer Delivery Form</title>
  {{> header-include }}
</head>
<body>
  {{> header }}
  <div class="page-sub-header horizontal">
    <div class="back-link">
      <a href="/">[&larr; Go Back]</a>
    </div>
    <span class="page-title-sub-header">Form</span>
  </div>

  <main>
    <form id="volunteer-delivery-form" hx-post="/volunteer/delivery"
          hx-target="main" hx-swap="innerHTML">
      <div>
        <h1> Volunteer Form: Delivery </h1>
      </div>
      <section>
        <h2> Site </h2>
        <div class="inputs">
          <div class="form-input">
            <label for="site-select"> Select your site: </label>
            <select name="site" id="site-select" required
                    hx-get="/volunteer/site-items"
                    hx-trigger="load, change"
                    hx-target="#site-items-panel" hx-swap="innerHTML">
              {{#sites}}
                <option value="{{id}}"> {{name}} </option>
              {{/sites}}
            </select>
          </div>
        </div>
      </section>

      <section>
        <h2> Contact Info </h2>

        <div class="inputs">
          <div class="form-input">
            <label for="name-input"> Name: </label>
            <input type="text" id="name-input" name="volunteerName" required/>
          </div>

          <div class="form-input">
            <label for="contact-input"> Phone Number: </label>
            <label for="contact-input"> **Format: Please use only numbers (ex: 336123456) </label>
            <input type="tel" pattern="[0-9]{10}" id="contact-input" name="volunteerContact" required/>
          </div>
        </div>
      </section>

      <section>
        <h2> Items </h2>
        <div class="items">
          <div class="items-container">
            <h4> Site &amp; Needed Items </h4>
            <div id="site-items-panel">
              <!-- htmx loads the selected site's address + needed-item checkboxes here -->
            </div>
          </div>
        </div>
      </section>

      <section style="display: flex; flex-direction: row-reverse">
        <button type="submit"> Submit </button>
      </section>
    </form>
  </main>

</body>
</html>
