<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./request.css">
  <link rel="stylesheet" href="../../style.css">
  <title>Delivery Request</title>
  {{> header-include }}
</head>
<body>
  {{> header }}

  <h1> Request Page </h1>
  <main>
    <div id="request-portal" data-urlkey="{{urlKey}}">
      {{#userRequiresPhoneAuth}}
        {{> volunteer/delivery/verification-form }}
      {{/userRequiresPhoneAuth}}
      {{^userRequiresPhoneAuth}}
        <div hx-post="/volunteer/verify-delivery"
             hx-trigger="load"
             hx-vals='{"userPhone":"{{userPhone}}","urlKey":"{{urlKey}}"}'
             hx-target="#request-portal" hx-swap="innerHTML">
          Loading delivery details&hellip;
        </div>
      {{/userRequiresPhoneAuth}}
    </div>
  </main>

</body>
</html>
