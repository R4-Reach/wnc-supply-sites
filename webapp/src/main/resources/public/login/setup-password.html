<html lang="en">
<head>
  <title>WNC Supply Sites - Setup Password</title>
  <link rel="stylesheet" href="setup-password.css"/>
  <link rel="stylesheet" href="../style.css"/>
  <link rel="stylesheet" href="../mobile.css"/>
  {{> header-include }}
  <script>
    // Toggles the password field between hidden and visible. htmx can't change an input's type,
    // so this stays as a small handler; it is defined on the page so it survives fragment swaps.
    function togglePassword() {
      const x = document.getElementById("password");
      x.type = x.type === "password" ? "text" : "password";
    }
  </script>
</head>

<body>
{{> header }}

<!-- The setup-password wizard: each step's htmx form swaps the next step's fragment in here. -->
<div id="setup-wizard">
  {{> login/fragments/phone }}
</div>

</body>
</html>
