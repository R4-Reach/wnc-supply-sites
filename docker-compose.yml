---
services:
  database:
    image: postgres:16.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # Fixed host port for local `just up` (override with WSS_DB_PORT). The Gradle `test` task
    # sets WSS_DB_PORT=0 so its stack gets an ephemeral port and never collides.
    ports: ['${WSS_DB_PORT:-5432}:5432']
    volumes:
      - ./.docker-compose/database/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: echo 'select 1' | psql -h localhost -U postgres  | grep -q '1 row'
      interval: 3s
      retries: 10
      timeout: 3s
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
  flyway:
    image: flyway/flyway
    volumes: [./schema/:/flyway/sql]
    command: >
      -locations=filesystem:/flyway/sql
      -connectRetries=60
      -user=postgres
      -password=postgres
      -url=jdbc:postgresql://database:5432/wnc_helene
      migrate
    depends_on:
      database:
        condition: service_healthy
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    ports: ['${WSS_APP_PORT:-8080}:8080']
    environment:
      DB_URL: database:5432
      DB_NAME: wnc_helene
      DATABASE_HOST: database
      DATABASE_TCP_5432: '5432'
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:-12345678901234567890123456789012}
      DB_PII_KEY: ${DB_PII_KEY:-12345678901234567890123456789012}
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      flyway:
        condition: service_completed_successfully
