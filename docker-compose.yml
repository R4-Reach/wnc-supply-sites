---
services:
  database:
    image: postgres:16.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # Fixed host port for local `just up` (override with WSS_DB_PORT). The gradle test stack
    # (`just verify`) sets WSS_DB_PORT=0 so it gets an ephemeral port and never collides.
    ports: ['${WSS_DB_PORT:-5432}:5432']
    volumes:
      - ./.docker-compose/database/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: echo 'select 1' | psql -h localhost -U postgres  | grep -q '1 row'
      interval: 3s
      retries: 10
      timeout: 3s
  flyway:
    image: flyway/flyway
    volumes: [./schema/:/flyway/sql]
    command: >
      -locations=filesystem:/flyway/sql
      -connectRetries=60
      -user=postgres
      -password=postgres
      -url=jdbc:postgresql://database:5432/wnc_helene
      migrate
    depends_on:
      database:
        condition: service_healthy
